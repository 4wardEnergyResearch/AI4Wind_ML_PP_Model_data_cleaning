[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai4wind_ml"]

[project]
name = "ai4wind-ml"
version = "0.1.0"
description = "Wind turbine power prediction using ERA5 wind speed data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "xarray>=2023.1",
    "netcdf4>=1.6",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "openpyxl>=3.1",
    "xgboost>=3.2.0",
]
